version: 2
updates:
  # Keep GitHub Actions pinned-SHAs current (opens PRs that bump the SHA and the
  # trailing "# vX" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python (physics library + API).
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
