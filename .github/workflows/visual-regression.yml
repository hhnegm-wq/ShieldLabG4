name: Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ./python
          python -m pip install -r api/requirements.txt
          python -m pip install pytest streamlit playwright pillow
          python -m playwright install --with-deps chromium

      - name: Run visual regression gate
        run: |
          export SHIELDLAB_UI_SMOKE=1
          export PYTHONPATH="$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE/ui${PYTHONPATH:+:$PYTHONPATH}"
          bash "$GITHUB_WORKSPACE/scripts/ci_visual_regression_gate.sh"

      - name: Upload visual artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-artifacts
          path: |
            tests/visual/screenshots/
            .ci_streamlit_visual.log
          if-no-files-found: warn