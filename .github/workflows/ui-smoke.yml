name: UI Smoke (Playwright)

# End-to-end Streamlit + Playwright smoke test. Kept in its own workflow (not in
# the Release Validation Gate) so that a flaky/opaque browser E2E never blocks
# the deterministic release gate, while still running on every push/PR and being
# independently visible and debuggable.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ./python
          python -m pip install -r api/requirements.txt
          python -m pip install pytest streamlit playwright
          python -m playwright install --with-deps chromium

      - name: Run Playwright UI smoke
        run: bash "$GITHUB_WORKSPACE/scripts/ci_ui_smoke_gate.sh"
