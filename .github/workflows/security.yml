name: Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly — Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub Security tab

jobs:
  # ── Python dependency audit ────────────────────────────────────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package + audit tool + SBOM tool
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install pip-audit cyclonedx-bom
          python -m pip install -e ./python
          python -m pip install -r api/requirements.txt
          # requirements.appservice.txt uses -e flag which pip-audit handles via editable
          python -m pip install PyJWT streamlit fastapi uvicorn

      - name: Run pip-audit (fail on unfixed HIGH/CRITICAL)
        # --desc on includes human-readable descriptions; --fix is NOT used (review before applying)
        run: |
          pip-audit --format json --output pip-audit.json || true
          python - <<'EOF'
          import json, sys
          try:
              data = json.load(open("pip-audit.json"))
          except Exception as e:
              print(f"Could not parse pip-audit output: {e}")
              sys.exit(0)
          # pip-audit v2 output schema: list of {name, version, vulns: [{id, fix_versions, ...}]}
          vulns_found = []
          deps = data if isinstance(data, list) else data.get("dependencies", [])
          for dep in deps:
              for v in dep.get("vulns", []):
                  vulns_found.append(
                      f"{dep.get('name','?')} {dep.get('version','?')}: "
                      f"{v.get('id','?')} — {v.get('description','')[:120]}"
                  )
          if vulns_found:
              print(f"\n{len(vulns_found)} vulnerability/vulnerabilities found:")
              for line in vulns_found:
                  print(f"  VULN: {line}")
              sys.exit(1)
          print("pip-audit: no known vulnerabilities found.")
          EOF

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 90

      - name: Generate CycloneDX SBOM (environment)
        run: cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx-json
          path: sbom.json
          retention-days: 365   # keep SBOM for one year per release cadence

  # ── Container image scan (worker) ─────────────────────────────────────────
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build worker image
        # The worker Dockerfile COPYs python/ and worker/ from the repo root, so it
        # must be built with the repo root as context, not ./worker.
        run: docker build -t shieldlab-worker:ci -f worker/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shieldlab-worker:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"          # report-only: findings are surfaced via SARIF
                                  # in the Security tab without hard-blocking CI
                                  # on churny upstream base-image CVEs.
          ignore-unfixed: true   # skip CVEs with no upstream fix

      - name: Upload Trivy SARIF to GitHub Security
        # SARIF upload to the Security tab requires GitHub Advanced Security /
        # code scanning, which is unavailable on private repos without GHAS.
        # Keep it non-fatal so the scan job stays green; it will populate the
        # Security tab automatically once the repo is public or GHAS is enabled.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 90

  # ── Source secret / credential scan ───────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
