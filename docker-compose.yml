# ShieldLab G4 — one-command local/free stack (UI + API + worker).
#
# Runs entirely on the LocalBackend (filesystem + SQLite) — no cloud account,
# no external services. Ideal for a single Linux VM such as Oracle Cloud
# Always Free, or a laptop.
#
#   docker compose up -d --build
#   UI  -> http://<host>:8501      API -> http://<host>:8000
#
# All three services share one image and one data volume (the SQLite queue +
# blob store). Move to Azure later with SHIELDLAB_BACKEND=azure — no code changes.
name: shieldlabg4

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: shieldlabg4:local
  environment: &app-env
    SHIELDLAB_BACKEND: local
    SHIELDLAB_LOCAL_DATA_DIR: /data
    SHIELDLAB_QUEUE_NAME: simulation-jobs
    SHIELDLAB_INPUT_CONTAINER: simulation-input
    SHIELDLAB_OUTPUT_CONTAINER: simulation-output
  volumes:
    - shieldlab-data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    container_name: shieldlab-api
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    <<: *app
    container_name: shieldlab-worker
    command: ["python", "worker/queue_worker.py"]
    environment:
      <<: *app-env
      SHIELDLAB_RESULTS_DIR: /tmp/shieldlab-results

  ui:
    <<: *app
    container_name: shieldlab-ui
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "${UI_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  shieldlab-data:
