# ShieldLab G4 — one-command local/free stack (UI + API + worker).
#
# Runs entirely on the LocalBackend (filesystem + SQLite) — no cloud account,
# no external services. Ideal for a single Linux VM such as Oracle Cloud
# Always Free, or a laptop.
#
#   docker compose up -d --build
#   UI  -> http://<host>:8501      API -> http://<host>:8000
#
# All three services share one image and one data volume (the SQLite queue +
# blob store). Move to Azure later with SHIELDLAB_BACKEND=azure — no code changes.
name: shieldlabg4

x-app: &app
  image: shieldlabg4:local
  environment: &app-env
    SHIELDLAB_BACKEND: local
    SHIELDLAB_LOCAL_DATA_DIR: /data
    SHIELDLAB_QUEUE_NAME: simulation-jobs
    SHIELDLAB_INPUT_CONTAINER: simulation-input
    SHIELDLAB_OUTPUT_CONTAINER: simulation-output
    # --- Security / auth (pass-through from .env; empty = secure-by-default) ---
    # API auth: with no keys configured the API returns 503 on protected routes.
    SHIELDLAB_API_KEY_HASHES: ${SHIELDLAB_API_KEY_HASHES:-}
    SHIELDLAB_API_KEYS: ${SHIELDLAB_API_KEYS:-}
    SHIELDLAB_CORS_ORIGINS: ${SHIELDLAB_CORS_ORIGINS:-}
    SHIELDLAB_RATE_LIMIT_PER_MIN: ${SHIELDLAB_RATE_LIMIT_PER_MIN:-60}
    # Per-IP flood/brute-force throttle applied to ALL requests (incl. failed auth).
    SHIELDLAB_GLOBAL_RATE_LIMIT_PER_MIN: ${SHIELDLAB_GLOBAL_RATE_LIMIT_PER_MIN:-120}
    # Trust X-Forwarded-For only when running behind the Caddy proxy (profile: proxy).
    SHIELDLAB_TRUST_PROXY: ${SHIELDLAB_TRUST_PROXY:-0}
    SHIELDLAB_DEV: ${SHIELDLAB_DEV:-0}
    # UI tier auth (self-hosted Pro / JWT).
    SHIELDLAB_LICENSE_KEY: ${SHIELDLAB_LICENSE_KEY:-}
    SHIELDLAB_PRO_KEY_HASH: ${SHIELDLAB_PRO_KEY_HASH:-}
    SHIELDLAB_JWT_SECRET: ${SHIELDLAB_JWT_SECRET:-}
    SHIELDLAB_SUPABASE_URL: ${SHIELDLAB_SUPABASE_URL:-}
    SHIELDLAB_SUPABASE_ANON_KEY: ${SHIELDLAB_SUPABASE_ANON_KEY:-}
    SHIELDLAB_SUPABASE_REDIRECT_TO: ${SHIELDLAB_SUPABASE_REDIRECT_TO:-}
  volumes:
    - shieldlab-data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shieldlab-api
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    <<: *app
    container_name: shieldlab-worker
    command: ["python", "worker/queue_worker.py"]
    environment:
      <<: *app-env
      SHIELDLAB_RESULTS_DIR: /tmp/shieldlab-results

  ui:
    <<: *app
    container_name: shieldlab-ui
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "${UI_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Opt-in auto-HTTPS reverse proxy. Enable with:  docker compose --profile proxy up -d
  # Publishes only 80/443; terminates TLS and forwards to api + ui internally.
  caddy:
    image: caddy:2
    container_name: shieldlab-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - api
      - ui
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SHIELDLAB_DOMAIN: ${SHIELDLAB_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shieldlab-data:
  caddy-data:
  caddy-config:
