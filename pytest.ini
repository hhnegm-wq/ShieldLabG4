[pytest]
testpaths = tests
norecursedirs = backups build .venv .git node_modules __pycache__
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pkg_resources
addopts = -ra
markers =
    ui: browser/UI-facing tests that require the Streamlit application surface
    network: tests that exercise HTTP/browser network interactions
